<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskPulse - A sleek, modern, light & dark To-Do and Task Management Web App with soft pastel colors, priority tracking, and analytics.">
  <title>TaskPulse — Modern Task Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Soft Ambient Glow Accents -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Task<span>Pulse</span></h1>
          <p id="current-date">Today's Focus</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Interactive Light / Dark Mode Toggle Pill -->
        <div class="theme-switch-wrapper" title="Switch Theme (Light / Dark)">
          <button id="theme-toggle" class="theme-toggle-pill" aria-label="Toggle Light and Dark Theme">
            <span class="theme-option light-opt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <span>Light</span>
            </span>
            <span class="theme-option dark-opt">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <span>Dark</span>
            </span>
            <span class="theme-slider"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Progress Card -->
    <section class="progress-card glass-panel" aria-label="Task Progress Summary">
      <div class="progress-content">
        <div class="progress-details">
          <span class="progress-greeting" id="quote-text">Stay productive and achieve your goals!</span>
          <div class="progress-stats">
            <div class="stat-item">
              <span class="stat-number" id="stat-total">0</span>
              <span class="stat-label">Total</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
              <span class="stat-number" id="stat-pending">0</span>
              <span class="stat-label">Pending</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
              <span class="stat-number stat-success" id="stat-completed">0</span>
              <span class="stat-label">Done</span>
            </div>
          </div>
        </div>

        <div class="progress-ring-container">
          <svg class="progress-ring" viewBox="0 0 100 100">
            <circle class="progress-ring-bg" cx="50" cy="50" r="40" />
            <circle class="progress-ring-fill" id="progress-circle" cx="50" cy="50" r="40" />
          </svg>
          <div class="progress-ring-label">
            <span id="progress-percentage">0%</span>
          </div>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </section>

    <!-- Task Creator Form -->
    <section class="task-form-card glass-panel" aria-label="Create New Task">
      <form id="task-form" autocomplete="off">
        <div class="input-main-row">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="task-title-input" 
              placeholder="What needs to be done? (Press Enter to add)" 
              required 
              maxlength="120"
            />
          </div>
          <button type="submit" id="add-task-btn" class="btn btn-primary" title="Add Task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add Task</span>
          </button>
        </div>

        <!-- Collapsible / Advanced Options -->
        <div class="task-options-row">
          <div class="option-group">
            <label for="task-category-select">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
              </svg>
              Category
            </label>
            <select id="task-category-select">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Health">Health</option>
              <option value="Finance">Finance</option>
              <option value="Ideas">Ideas</option>
            </select>
          </div>

          <div class="option-group">
            <label for="task-priority-select">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
              Priority
            </label>
            <select id="task-priority-select">
              <option value="Medium">Medium Priority</option>
              <option value="High">High Priority</option>
              <option value="Low">Low Priority</option>
            </select>
          </div>

          <div class="option-group">
            <label for="task-due-date-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              Due Date
            </label>
            <input type="date" id="task-due-date-input" />
          </div>
        </div>
      </form>
    </section>

    <!-- Controls, Filter & Search Bar -->
    <section class="controls-card glass-panel" aria-label="Filters and Search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search tasks..." />
        <button id="clear-search-btn" class="clear-btn" aria-label="Clear search" style="display: none;">&times;</button>
      </div>

      <div class="filter-sort-row">
        <!-- Status Tabs -->
        <div class="filter-tabs" role="tablist">
          <button class="tab-btn active" data-filter="all" role="tab">All <span class="badge" id="badge-all">0</span></button>
          <button class="tab-btn" data-filter="active" role="tab">Active <span class="badge" id="badge-active">0</span></button>
          <button class="tab-btn" data-filter="completed" role="tab">Completed <span class="badge" id="badge-completed">0</span></button>
        </div>

        <!-- Filter & Sort dropdowns -->
        <div class="dropdown-filters">
          <select id="filter-category" class="filter-select" aria-label="Filter by category">
            <option value="all">All Categories</option>
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Health">Health</option>
            <option value="Finance">Finance</option>
            <option value="Ideas">Ideas</option>
          </select>

          <select id="filter-priority" class="filter-select" aria-label="Filter by priority">
            <option value="all">All Priorities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>

          <select id="sort-select" class="filter-select" aria-label="Sort tasks">
            <option value="created-desc">Newest First</option>
            <option value="created-asc">Oldest First</option>
            <option value="due-asc">Due Date (Earliest)</option>
            <option value="priority-desc">Priority (High to Low)</option>
            <option value="title-asc">Alphabetical (A-Z)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Task List Container -->
    <main class="tasks-section" aria-label="Tasks">
      <div class="tasks-header">
        <h2 id="current-view-title">All Tasks</h2>
        <div class="tasks-header-actions">
          <button id="clear-completed-btn" class="btn btn-secondary-sm" title="Remove all completed tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear Completed
          </button>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite">
        <!-- Dynamically populated tasks will appear here -->
      </ul>

      <!-- Empty State View -->
      <div id="empty-state" class="empty-state glass-panel" style="display: none;">
        <div class="empty-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <h3 id="empty-state-title">No tasks found</h3>
        <p id="empty-state-subtitle">Add a task above to keep your productivity flowing!</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>TaskPulse &bull; Pure HTML &amp; CSS &bull; Local Storage Persistent</p>
    </footer>
  </div>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-container glass-panel">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button id="modal-close-btn" class="icon-btn modal-close" aria-label="Close modal">&times;</button>
      </div>
      <form id="edit-form">
        <input type="hidden" id="edit-task-id" />
        <div class="modal-body">
          <div class="form-group">
            <label for="edit-title-input">Task Title</label>
            <input type="text" id="edit-title-input" required maxlength="120" />
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label for="edit-category-select">Category</label>
              <select id="edit-category-select">
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Health">Health</option>
                <option value="Finance">Finance</option>
                <option value="Ideas">Ideas</option>
              </select>
            </div>
            <div class="form-group">
              <label for="edit-priority-select">Priority</label>
              <select id="edit-priority-select">
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="edit-due-date-input">Due Date</label>
            <input type="date" id="edit-due-date-input" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
